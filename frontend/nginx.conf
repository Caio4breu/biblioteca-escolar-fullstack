server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # o navegador sempre confere se ha versao nova (evita tela antiga em cache)
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # A SPA fala com o backend pelo mesmo endereco (sem CORS)
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://backend:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        # evita a janela nativa de login do navegador em respostas 401
        proxy_hide_header WWW-Authenticate;
    }
}
