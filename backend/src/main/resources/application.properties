spring.application.name=backend
server.port=8080
server.error.include-message=always

# Conexao via PgBouncer (localhost:6432 fora do Docker, pgbouncer:6432 dentro)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:6432/biblioteca}
spring.datasource.username=${DB_USER:app_atendente}
spring.datasource.password=${DB_PASSWORD:atendente123}

# Pool HikariCP enxuto (o PgBouncer faz o pool principal)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# O schema e controlado pelo bd/backup.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.cpf-key=${CPF_KEY:chave-secreta}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
