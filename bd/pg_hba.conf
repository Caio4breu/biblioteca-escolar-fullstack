# pg_hba.conf - Biblioteca Escolar
# TYPE  DATABASE     USER   ADDRESS          METHOD

# Acesso local (docker exec psql dentro do container)
local   all          all                     scram-sha-256
host    all          all    127.0.0.1/32     scram-sha-256

# Somente o PgBouncer (172.28.0.20) pode conectar ao banco da aplicacao
host    biblioteca   all    172.28.0.20/32   scram-sha-256

# Todo o resto e rejeitado
host    all          all    0.0.0.0/0        reject
host    all          all    ::/0             reject
