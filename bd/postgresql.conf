# postgresql.conf - Biblioteca Escolar
# Apenas os parametros ajustados; o restante usa o padrao do PostgreSQL 17.

# Conexoes
listen_addresses = '*'
port = 5432
max_connections = 50
hba_file = '/etc/postgresql/pg_hba.conf'

# Autenticacao
password_encryption = scram-sha-256

# Memoria
shared_buffers = 128MB
work_mem = 4MB

# Timeouts de servidor
statement_timeout = 10s                       # cancela queries longas
idle_in_transaction_session_timeout = 30s     # derruba transacoes abandonadas
lock_timeout = 5s

# Logs
log_connections = on
log_disconnections = on
log_min_duration_statement = 1000             # loga queries acima de 1s
log_line_prefix = '%t [%p] %u@%d '

# Regional
timezone = 'America/Sao_Paulo'
lc_messages = 'en_US.utf8'
