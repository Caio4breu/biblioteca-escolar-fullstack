services:
  db:
    image: postgres:17
    container_name: biblioteca_db
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biblioteca
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./bd/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./bd/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./bd/backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      rede_biblioteca:
        ipv4_address: 172.28.0.10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: biblioteca_pgbouncer
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      rede_biblioteca:
        ipv4_address: 172.28.0.20

  backend:
    build: ./backend
    container_name: biblioteca_backend
    environment:
      DB_URL: jdbc:postgresql://pgbouncer:6432/biblioteca
      DB_USER: app_atendente
      DB_PASSWORD: atendente123
      CPF_KEY: chave-secreta
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      - pgbouncer
    restart: on-failure
    networks:
      rede_biblioteca:
        ipv4_address: 172.28.0.30

  frontend:
    build: ./frontend
    container_name: biblioteca_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      rede_biblioteca:
        ipv4_address: 172.28.0.40

networks:
  rede_biblioteca:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
